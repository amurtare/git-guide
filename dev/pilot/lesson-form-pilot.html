<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Git Guide 레슨 파일럿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+KR:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 히어로(eyebrow·세리프 제목·리드) → 전이 표시 → 공용 도식(로컬 | 서버 | 동료) → 장면 설명 + 용어 카드 → 장면 이동
   디자인: .claude/skills/visualize html-design-guide Part 1 토큰 + project-memory/decisions/visual-style.md 조정 */
:root{
  --bg:oklch(0.95 0.02 85); --surface:oklch(0.985 0.012 88); --surface-alt:oklch(0.965 0.018 85);
  --ink:oklch(0.18 0.03 245); --ink-soft:oklch(0.36 0.025 245); --ink-muted:oklch(0.52 0.02 245); --ink-line:oklch(0.85 0.02 80);
  --p1:oklch(0.58 0.14 48); --p2:oklch(0.52 0.13 148); --p3:oklch(0.62 0.15 85); --p4:oklch(0.48 0.14 320); --p5:oklch(0.50 0.09 200);
  --p1-soft:oklch(0.93 0.05 50); --p2-soft:oklch(0.93 0.04 148); --p3-soft:oklch(0.94 0.06 85); --p4-soft:oklch(0.92 0.04 320); --p5-soft:oklch(0.93 0.03 200);
  --p3-text:oklch(0.46 0.11 85);
  --wash-a:oklch(0.66 0.16 85 / .10); --wash-b:oklch(0.50 0.09 200 / .08); --wash-c:oklch(0.48 0.14 320 / .06);
  --grain-op:.55; --blend:multiply;
  --r-lg:18px; --r-md:12px; --r-sm:6px; --r-pill:999px;
  --e1:0 1px 2px oklch(0.20 0.03 245 / .05),0 1px 3px oklch(0.20 0.03 245 / .04);
  --e2:0 2px 4px oklch(0.20 0.03 245 / .05),0 4px 12px oklch(0.20 0.03 245 / .06);
  --e3:0 4px 8px oklch(0.20 0.03 245 / .06),0 12px 28px oklch(0.20 0.03 245 / .08);
  --f-display:"Newsreader","Noto Serif KR","AppleMyungjo","Batang",ui-serif,Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease-out:cubic-bezier(0.22,1,0.36,1); --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --local:var(--p5); --local-soft:var(--p5-soft); --remote:var(--p4); --remote-soft:var(--p4-soft);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:oklch(0.19 0.015 245); --surface:oklch(0.235 0.018 245); --surface-alt:oklch(0.21 0.016 245);
  --ink:oklch(0.94 0.012 85); --ink-soft:oklch(0.82 0.015 85); --ink-muted:oklch(0.68 0.015 85); --ink-line:oklch(0.36 0.02 245);
  --p1:oklch(0.74 0.13 48); --p2:oklch(0.74 0.13 148); --p3:oklch(0.82 0.14 85); --p4:oklch(0.74 0.12 320); --p5:oklch(0.76 0.09 200);
  --p1-soft:oklch(0.32 0.06 48); --p2-soft:oklch(0.31 0.05 148); --p3-soft:oklch(0.33 0.06 85); --p4-soft:oklch(0.31 0.06 320); --p5-soft:oklch(0.31 0.04 200);
  --p3-text:oklch(0.84 0.13 85);
  --wash-a:oklch(0.66 0.16 85 / .07); --wash-b:oklch(0.50 0.09 200 / .10); --wash-c:oklch(0.48 0.14 320 / .08);
  --grain-op:.18; --blend:screen; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(0.19 0.015 245); --surface:oklch(0.235 0.018 245); --surface-alt:oklch(0.21 0.016 245);
  --ink:oklch(0.94 0.012 85); --ink-soft:oklch(0.82 0.015 85); --ink-muted:oklch(0.68 0.015 85); --ink-line:oklch(0.36 0.02 245);
  --p1:oklch(0.74 0.13 48); --p2:oklch(0.74 0.13 148); --p3:oklch(0.82 0.14 85); --p4:oklch(0.74 0.12 320); --p5:oklch(0.76 0.09 200);
  --p1-soft:oklch(0.32 0.06 48); --p2-soft:oklch(0.31 0.05 148); --p3-soft:oklch(0.33 0.06 85); --p4-soft:oklch(0.31 0.06 320); --p5-soft:oklch(0.31 0.04 200);
  --p3-text:oklch(0.84 0.13 85);
  --wash-a:oklch(0.66 0.16 85 / .07); --wash-b:oklch(0.50 0.09 200 / .10); --wash-c:oklch(0.48 0.14 320 / .08);
  --grain-op:.18; --blend:screen; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;mix-blend-mode:var(--blend);
  background:radial-gradient(ellipse 80% 60% at 20% 0%,var(--wash-a) 0%,transparent 60%),radial-gradient(ellipse 70% 50% at 100% 30%,var(--wash-b) 0%,transparent 60%),radial-gradient(ellipse 80% 70% at 0% 100%,var(--wash-c) 0%,transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:var(--grain-op);mix-blend-mode:var(--blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.2 0 0 0 0 0.18 0 0 0 0 0.18 0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;display:grid;gap:22px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
h1,h2,h3,.who,.area-head,.lede,.scene-text p,aside.gloss p{word-break:keep-all;overflow-wrap:break-word}

/* 히어로 */
.pilot-note{font-size:13px;color:var(--ink-muted);border:1px dashed var(--ink-line);border-radius:var(--r-md);padding:8px 14px;margin:0}
.pilot-note b{color:var(--ink)}
.eyebrow,.sec-eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:10px;color:var(--accent,var(--p2))}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.sec-eyebrow::after{content:"";flex:1;height:1px;background:var(--ink-line)}
header.lesson{display:grid;gap:8px}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,4.6vw,48px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:italic;font-weight:400;color:var(--p2)}
.lede{margin:0;color:var(--ink-soft);max-width:60ch;font-size:16px}
.fade{animation:fadeUp .7s var(--ease-out) both}
.fade:nth-child(2){animation-delay:80ms}.fade:nth-child(3){animation-delay:160ms}.fade:nth-child(4){animation-delay:240ms}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 전이 표시 */
.opbar{min-height:40px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.opbar .none{color:var(--ink-muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.op{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--ink-line);background:var(--surface);border-radius:var(--r-pill);padding:5px 16px 5px 5px;cursor:pointer;box-shadow:var(--e1);transition:transform .3s var(--ease-out),box-shadow .3s var(--ease-out)}
.op:hover{transform:translateY(-2px);box-shadow:var(--e2)}
.op .name{background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:2px 12px;font-family:var(--f-display);font-style:italic;font-size:15px}
.op .path{color:var(--ink-soft)}

/* 공용 도식 */
.diagram-scroll{overflow-x:auto;padding:4px 2px 10px}
.diagram{display:flex;gap:18px;align-items:stretch}
.space{flex:1 1 0;min-width:0;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--ink-line);border-top:4px solid var(--sc);border-radius:var(--r-lg);box-shadow:var(--e2);display:flex;flex-direction:column;transition:opacity .45s var(--ease-out),filter .45s}
.space::after{content:"";position:absolute;top:-80px;right:-80px;width:240px;height:240px;background:radial-gradient(circle,var(--sc-soft) 0%,transparent 70%);filter:blur(20px);opacity:.7;pointer-events:none}
.space.me,.space.peer{--sc:var(--local);--sc-soft:var(--local-soft);flex-grow:2.4}
.space.server{--sc:var(--remote);--sc-soft:var(--remote-soft);flex-grow:1.2}
.diagram[data-count="3"] .space.me,.diagram[data-count="3"] .space.peer{flex-grow:1.5}
.space-head{position:relative;z-index:1;display:flex;align-items:baseline;gap:10px;padding:12px 16px 8px;border:0;background:transparent;text-align:left;cursor:pointer;width:100%}
.space-head .who{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--sc)}
.space-head .kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.areas{position:relative;z-index:1;display:flex;gap:10px;padding:0 12px 12px;flex:1}
.diagram[data-count="3"] .areas{flex-direction:column}
.area{flex:1 1 0;min-width:0;border:1px solid var(--ink-line);border-radius:var(--r-md);background:var(--surface-alt);padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px;min-height:160px;transition:opacity .45s var(--ease-out),filter .45s}
.diagram[data-count="3"] .area{min-height:0}
.area-head{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font-size:14px;font-weight:600;display:flex;flex-direction:column;line-height:1.3}
.area-head small{font-family:var(--f-mono);font-weight:400;color:var(--ink-muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.dim{opacity:.42;filter:saturate(.35)}
.area.dim{border-style:dashed}
.empty{font-size:12.5px;color:var(--ink-muted);font-style:italic;font-family:var(--f-display)}

/* 파일 카드: 상태는 색 + 표식 글자 + 상태 이름으로 함께 표시 */
.card{display:flex;align-items:center;gap:8px;border:1px solid var(--c);background:var(--cb);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--e1);transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease-out)}
.card:hover{transform:translateY(-2px);box-shadow:var(--e2)}
.card .fname{font-family:var(--f-mono);font-size:12.5px;flex:1;min-width:0;overflow-wrap:anywhere}
.card .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ct,var(--c))}
.card .badge i{font-style:normal;font-family:var(--f-mono);display:inline-grid;place-items:center;width:19px;height:19px;border-radius:var(--r-pill);background:var(--c);color:var(--surface);font-size:10.5px}
.card.plain{--c:var(--ink-line);--cb:var(--surface)}
.card.Modified{--c:var(--p1);--cb:var(--p1-soft)}
.card.Staged{--c:var(--p3);--ct:var(--p3-text);--cb:var(--p3-soft)}
.card.Committed{--c:var(--p2);--cb:var(--p2-soft)}

/* 버전 목록 */
.versions{display:flex;flex-direction:column;gap:5px}
.ver{font-size:12px;border:1px solid var(--ink-line);background:var(--surface);border-radius:var(--r-sm);padding:3px 10px;box-shadow:var(--e1)}

/* 커밋 히스토리 */
.history{position:relative;height:170px}
.node{position:absolute;top:8px;width:42px;height:42px;margin-left:-21px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;cursor:pointer;padding:0;box-shadow:var(--e2);transition:transform .3s var(--ease-spring)}
.node:hover{transform:scale(1.08)}
.edge{position:absolute;top:28px;height:2px;background:var(--ink-soft);margin-left:1px}
.edge::before{content:"";position:absolute;left:-1px;top:-4px;border:5px solid transparent;border-right:7px solid var(--ink-soft);border-left:0}
.lbl{position:absolute;width:0}
.lbl-in{position:absolute;left:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.chip{font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:var(--r-pill);padding:1px 9px;cursor:pointer;border:1.5px solid var(--ink);background:var(--surface);position:relative}
.chip.branch::before{content:"";position:absolute;left:50%;top:-7px;margin-left:-4px;border:4px solid transparent;border-bottom:5px solid var(--ink);border-top:0}
.chip.remote{border-color:var(--remote);color:var(--remote);background:var(--remote-soft)}
.chip.remote::before{border-bottom-color:var(--remote)}
.chip.tracking{border-style:dashed;color:var(--ink-muted);border-color:var(--ink-muted)}
.chip.tracking::before{border-bottom-color:var(--ink-muted)}
.chip.head{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.head::before{display:none}
.arrow{font-size:11px;color:var(--ink-muted);line-height:1.1}

.enter{animation:enter .6s var(--ease-spring) both}
@keyframes enter{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

/* 설명 + 용어 카드 */
.below{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.scene-text{min-width:0;--accent:var(--p1)}
.scene-text h2{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,2.6vw,28px);line-height:1.2;letter-spacing:-.01em;margin:8px 0 10px;text-wrap:balance}
.scene-text p{margin:0;max-width:62ch;color:var(--ink-soft)}
.scene-text.swap{animation:fadeUp .5s var(--ease-out) both}
.term-btn{border:0;background:transparent;padding:0 1px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--p2);text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer;font-weight:500}
.term-btn:hover{background:var(--p2-soft);border-radius:4px}
aside.gloss{min-width:0;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--ink-line);border-top:4px solid var(--p2);border-radius:var(--r-lg);padding:14px 18px 16px;font-size:14px;box-shadow:var(--e1);--accent:var(--p2)}
aside.gloss::after{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,var(--p2-soft) 0%,transparent 70%);filter:blur(20px);opacity:.6;pointer-events:none}
aside.gloss h3{font-family:var(--f-display);font-weight:500;margin:8px 0 0;font-size:22px;line-height:1.2}
aside.gloss .en{color:var(--ink-muted);font-family:var(--f-mono);font-size:11.5px;margin-top:4px}
aside.gloss p{margin:10px 0 0;position:relative}
aside.gloss .src{font-size:11.5px;color:var(--ink-muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--ink-line);overflow-wrap:anywhere}

/* 장면 이동 */
nav.steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px}
nav.steps .btn{border:1px solid var(--ink-line);background:var(--surface);border-radius:var(--r-pill);padding:9px 20px;cursor:pointer;box-shadow:var(--e1);transition:transform .3s var(--ease-out),box-shadow .3s var(--ease-out)}
nav.steps .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--e2)}
nav.steps .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
nav.steps .btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.dots{display:flex;gap:6px;margin:0 auto}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ink-line);background:var(--surface);font-family:var(--f-mono);font-size:12px;cursor:pointer;transition:transform .3s var(--ease-spring)}
.dots button:hover{transform:scale(1.1)}
.dots button[aria-current="step"]{background:var(--p2);color:var(--surface);border-color:var(--p2)}
footer{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-muted);border-top:1px solid var(--ink-line);padding-top:14px}

@media (max-width:760px){
  .diagram{flex-direction:column}
  .space,.area{flex:none}
  .areas{flex-direction:column}
  .area{min-height:0}
  .area .history{overflow-x:auto}
  .below{grid-template-columns:1fr}
  .dots{order:-1;width:100%;justify-content:center}
  nav.steps .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="wrap">
  <p class="pilot-note"><b>파일럿</b> · 모든 단계가 함께 쓸 레슨 페이지 공통 폼입니다. 안에 든 장면 5개는 폼이 어떻게 움직이는지 보이기 위한 예시 내용이며 확정 설계가 아닙니다.</p>

  <header class="lesson">
    <div class="eyebrow fade">Lesson · N단계</div>
    <h1 class="fade">레슨 <em>공통 폼</em></h1>
    <p class="lede fade">모든 단계가 같은 틀을 씁니다. 장면을 넘기면 도식이 바뀌고, 도식의 요소나 밑줄 친 용어를 누르면 뜻을 볼 수 있어요.</p>
  </header>

  <div class="opbar" id="opbar" aria-live="polite"></div>

  <div class="diagram-scroll"><div class="diagram" id="diagram"></div></div>

  <div class="below">
    <section class="scene-text" id="sceneText" aria-live="polite">
      <div class="sec-eyebrow" id="sceneEyebrow"></div>
      <h2 id="sceneTitle"></h2>
      <p id="sceneBody"></p>
    </section>
    <aside class="gloss" id="gloss" aria-live="polite"></aside>
  </div>

  <nav class="steps" aria-label="장면 이동">
    <button type="button" class="btn" id="first">처음으로</button>
    <button type="button" class="btn" id="prev">이전</button>
    <div class="dots" id="dots"></div>
    <button type="button" class="btn primary" id="next">다음</button>
  </nav>

  <footer>Git Guide v0.1.1 · 용어는 Pro Git 한국어판 표기를 따릅니다 · 키보드 ← → 로도 장면을 넘길 수 있습니다</footer>
</div>

<script>
// 용어집 (dev/design/glossary.md 에서 그대로 옮김)
const T = {
  "로컬 버전 관리":{en:"Local Version Control System",alias:"로컬 VCS",first:0,def:"내 컴퓨터 안의 간단한 데이터베이스에 파일의 변경 정보를 기록해 관리하는 방식",src:"01-introduction/sections/about-version-control.asc · 로컬 버전 관리"},
  "로컬 데이터베이스":{en:"local database",first:0,def:"로컬 VCS에서 파일의 변경 정보를 저장하는, 내 컴퓨터 안의 데이터베이스",src:"01-introduction/sections/about-version-control.asc · 로컬 버전 관리"},
  "중앙집중식 버전 관리(CVCS)":{en:"Centralized Version Control System",alias:"중앙집중식 VCS",first:0,def:"파일을 관리하는 서버를 따로 두고, 클라이언트가 그 중앙 서버에서 파일을 받아 쓰는 방식. 중앙 서버가 다운되면 그동안 아무도 협업하거나 작업을 백업할 수 없다",src:"01-introduction/sections/about-version-control.asc · 중앙집중식 버전 관리(CVCS)"},

  "분산 버전 관리 시스템(DVCS)":{en:"Distributed Version Control System",first:0,def:"클라이언트가 파일의 마지막 스냅샷만 받는 것이 아니라 저장소를 히스토리와 함께 전부 복제하는 방식. Git이 여기에 속한다",src:"01-introduction/sections/about-version-control.asc · 분산 버전 관리 시스템"},
  "저장소":{en:"repository",alias:"Git 저장소",first:0,def:"프로젝트의 파일과 그 히스토리 전체를 담는 곳",src:"02-git-basics/sections/getting-a-repository.asc · Git 저장소 만들기"},

  "Staging Area":{en:"staging area (index)",alias:"Index",first:2,def:"곧 커밋할 파일에 대한 정보를 저장하는 곳. Git 디렉토리 안에 있는 단순한 파일이다. 기술 용어로는 Index라고 한다",src:"01-introduction/sections/basics.asc · 세 가지 상태"},
  "Git 디렉토리":{en:"Git directory",first:1,def:"Git이 프로젝트의 메타데이터와 객체 데이터베이스를 저장하는 곳. Git의 핵심이며, 저장소를 새로 만들거나 Clone 할 때 만들어진다",src:"01-introduction/sections/basics.asc · 세 가지 상태"},

const AREAS = {
  local:[["files","파일",null],["db","로컬 데이터베이스",null]],
  cvcs:[["files","파일","버전 정보 없음"]],

};
const SERVER = {cvcs:["중앙 서버","중앙 데이터베이스",null], dvcs:["리모트 저장소","저장소","커밋 히스토리"]};

const $ = id => document.getElementById(id);
const esc = s => String(s);

function cards(list, ns){
  if(!list||!list.length) return `<div class="empty">비어 있음</div>`;
  return list.map(([name,st,ver])=>{
    const key = `${ns}:f:${name}${ver?":"+ver:""}`;
    const term = st||"파일";
    const badge = st?`<span class="badge"><i>${st[0]}</i>${st}</span>`:"";
    return `<button type="button" class="card ${st||"plain"}" data-key="${key}" data-term="${term}" aria-label="${name}${st?", "+st+" 상태":""}"><span class="fname">${name}</span>${badge}</button>`;
  }).join("");
}
function versions(list, ns){
  return `<div class="versions">${list.map(v=>`<div class="ver" data-key="${ns}:v:${v}">${v}</div>`).join("")}</div>`;
}
function history(h, ns){
  const X = i => 52 + i*96;
  const idx = Object.fromEntries(h.commits.map((c,i)=>[c,i]));
  let out = "";
  h.commits.forEach((c,i)=>{
    if(i>0) out += `<div class="edge" data-key="${ns}:e:${c}" style="left:${X(i-1)+21}px;width:${X(i)-X(i-1)-42}px" aria-hidden="true"></div>`;
    out += `<button type="button" class="node" data-key="${ns}:c:${c}" data-term="커밋" style="left:${X(i)}px" aria-label="커밋 ${c}">${c}</button>`;
  });
  const rows = {};
  h.labels.forEach(([name,at,kind,head])=>{
    const r = rows[at]||0;
    rows[at] = r + (head?60:30);
    const term = kind==="tracking"?"리모트 트래킹 브랜치":kind==="remote"?"리모트 브랜치":"main";
    const headHtml = head?`<span class="arrow" aria-hidden="true">↑</span><button type="button" class="chip head" data-term="HEAD">HEAD</button>`:"";
    out += `<div class="lbl" data-key="${ns}:l:${name}" style="left:${X(idx[at])}px;top:${62+r}px"><div class="lbl-in"><button type="button" class="chip ${kind}" data-term="${term}">${name}</button>${headHtml}</div></div>`;
  });
  return `<div class="history" style="min-width:${X(h.commits.length-1)+60}px">${out}</div>`;
}

function renderSpace(role, sp, kind){
  if(!sp) return "";
  const ns = role;
  let head, areas;
  if(role==="server"){
    const [label, area, sub] = SERVER[kind];
    head = `<button type="button" class="space-head" data-term="${label}"><span class="who">${label}</span><span class="kind">서버</span></button>`;
    const body = sp.hist?history(sp.hist, ns):versions(sp.versions, ns);
    areas = `<div class="area"><button type="button" class="area-head" data-term="${area}">${area}${sub?`<small>${sub}</small>`:""}</button>${body}</div>`;
  } else {
    const who = role==="me"?"나":"동료";
    head = `<button type="button" class="space-head" data-term="${who}"><span class="who">${who}</span><span class="kind">로컬</span></button>`;
    areas = AREAS[kind].map(([id,label,sub])=>{
      const a = sp.areas[id]||{};
      let body = "";
      if(a.hist) body = history(a.hist, ns);
      else if(a.versions) body = versions(a.versions, ns);
      else body = cards(a.files, ns);
      const term = T[label]?label:null;
      return `<div class="area ${a.dim?"dim":""}"><button type="button" class="area-head" ${term?`data-term="${term}"`:""}>${label}${sub?`<small>${sub}</small>`:""}</button>${body}</div>`;
    }).join("");
  }
  return `<section class="space ${role} ${sp.state==="dim"?"dim":""}" aria-label="${role==="server"?"서버":"로컬"} 공간">${head}<div class="areas">${areas}</div></section>`;
}

let track = "A", step = 0;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function snap(){
  const m = new Map();
  $("diagram").querySelectorAll("[data-key]").forEach(el=>m.set(el.dataset.key, el.getBoundingClientRect()));
  return m;
}
function render(animate){
  const prev = animate?snap():null;
  const L = SCENES[track], s = L.scenes[step];
  $("sceneEyebrow").textContent = `Scene ${step+1} / ${L.scenes.length}`;
  const st = $("sceneText"); st.classList.remove("swap"); void st.offsetWidth; if(animate) st.classList.add("swap");
  $("sceneTitle").textContent = s.title;
  $("sceneBody").innerHTML = s.body;
  $("opbar").innerHTML = s.op
    ? `<button type="button" class="op" data-term="${s.op[0]}"><span class="name">${s.op[0]}</span><span class="path">${s.op[1]}</span></button>`
    : `<span class="none">이 장면에는 전이가 없습니다</span>`;
  const spaces = [["me",s.me],["server",s.server],["peer",s.peer]].filter(x=>x[1]);
  const d = $("diagram");
  d.dataset.count = spaces.length;
  d.innerHTML = spaces.map(([r,sp])=>renderSpace(r,sp,s.kind)).join("");
  $("dots").innerHTML = L.scenes.map((_,i)=>`<button type="button" ${i===step?'aria-current="step"':""} data-step="${i}" aria-label="장면 ${i+1}">${i+1}</button>`).join("");
  $("prev").disabled = step===0;
  $("first").disabled = step===0;
  $("next").disabled = step===L.scenes.length-1;
  if(prev && !reduced){
    d.querySelectorAll("[data-key]").forEach(el=>{
      const r0 = prev.get(el.dataset.key), r1 = el.getBoundingClientRect();
      if(!r0){ el.classList.add("enter"); return; }
      const dx = r0.left-r1.left, dy = r0.top-r1.top;
      if(Math.abs(dx)>1||Math.abs(dy)>1)
        el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"translate(0,0)"}],{duration:650,easing:"cubic-bezier(.2,.7,.2,1)"});
    });
  }
}

function showTerm(k){
  const e = T[k]; if(!e) return;
  $("gloss").innerHTML = e.scene
    ? `<div class="sec-eyebrow">Scene name</div><h3>${k}</h3><p>${e.def}</p>`
    : `<div class="sec-eyebrow">Glossary</div><h3>${k}</h3><div class="en">${e.en}${e.alias?` · 별칭 ${e.alias}`:""} · ${e.first}단계</div><p>${e.def}</p><div class="src">출처: Pro Git 한국어판 ${e.src}</div>`;
}
function idleGloss(){
  $("gloss").innerHTML = `<div class="sec-eyebrow">Glossary</div><p>도식의 공간·영역·카드·커밋·이름표나 밑줄 친 용어를 누르면 용어집의 정의가 여기에 나옵니다.</p>`;
}

const go = n => { const max = SCENES[track].scenes.length-1; const v = Math.max(0,Math.min(max,n)); if(v!==step){ step=v; render(true);} };
$("next").onclick = ()=>go(step+1);
$("prev").onclick = ()=>go(step-1);
$("first").onclick = ()=>{ step=0; render(false); };
$("dots").onclick = e=>{ const b=e.target.closest("[data-step]"); if(b) go(+b.dataset.step); };
document.addEventListener("click", e=>{ const b=e.target.closest("[data-term]"); if(b) showTerm(b.dataset.term); });
document.addEventListener("keydown", e=>{ if(e.target.closest("input,textarea")) return; if(e.key==="ArrowRight") go(step+1); if(e.key==="ArrowLeft") go(step-1); });

idleGloss();
render(false);
</script>
</body>
</html>
